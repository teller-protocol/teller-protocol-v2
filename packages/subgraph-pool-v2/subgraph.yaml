specVersion: 0.0.4
description: Teller Protocol is a decentralized lending framework for Ethereum.
repository: https://github.com/teller-protocol/teller-protocol-v2
schema:
  file: ./src/schema.graphql
features:
  - nonFatalErrors
  - grafting
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: mainnet
    source:
      abi: Factory
      address: "0x21499A1Fd9f36ce527CB4A9032072ef1bb7a22F6"
      startBlock: 22783178
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/factory.ts
      entities:
        - Pool
      abis:
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: DeployedLenderGroupContract(indexed address)
          handler: handleLenderGroupDeployed
templates:
  - kind: ethereum/contract
    name: Pool
    network: mainnet
    source:
      abi: Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/core.ts
      entities:
        - Pool
      abis:
        - name: Pool
          file: ./abis/PoolV2.json
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: BorrowerAcceptedFunds(indexed address,indexed uint256,uint256,uint256,uint32,uint16)
          handler: handleBorrowerAcceptedFunds
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: LoanRepaid(indexed uint256,indexed address,uint256,uint256,uint256,uint256)
          handler: handleLoanRepaid
        - event: DefaultedLoanLiquidated(indexed uint256,indexed address,uint256,int256)
          handler: handleLoanLiquidated
        - event: PoolInitialized(indexed address,indexed address,uint256,uint32,uint16,uint16,uint16,uint16)
          handler: handlePoolInitialized

