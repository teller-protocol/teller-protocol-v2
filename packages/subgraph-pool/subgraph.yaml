specVersion: 0.0.4
description: Teller Protocol is a decentralized lending framework for Ethereum.
repository: https://github.com/teller-protocol/teller-protocol-v2
schema:
  file: ./src/schema.graphql
features:
  - nonFatalErrors
  - grafting
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: arbitrum-one
    source:
      abi: Factory
      address: "0xC2a093B641496Ac8AA9d6a17f216ADF4a42FC9B6"
      startBlock: 292978933
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/factory.ts
      entities:
        - Pool
      abis:
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: DeployedLenderGroupContract(indexed address)
          handler: handleLenderGroupDeployed
  - kind: ethereum/contract
    name: CollateralManager
    network: arbitrum-one
    source:
      abi: CollateralManager
      address: "0x71B04a8569914bCb99D5F95644CF6b089c826024"
      startBlock: 292978933
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/collateralManager.ts
      entities:
        - TellerBid
        - GroupPoolMetric
      abis:
        - name: CollateralManager
          file: ./abis/CollateralManager.json
      eventHandlers:
        - event: CollateralWithdrawn(uint256,uint8,address,uint256,uint256,address)
          handler: handleCollateralWithdrawn
templates:
  - kind: ethereum/contract
    name: Pool
    network: arbitrum-one
    source:
      abi: Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/core.ts
      entities:
        - Pool
      abis:
        - name: Pool
          file: ./abis/PoolV1.json
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: BorrowerAcceptedFunds(indexed address,indexed uint256,uint256,uint256,uint32,uint16)
          handler: handleBorrowerAcceptedFunds
        - event: EarningsWithdrawn(indexed address,uint256,uint256,indexed address)
          handler: handleEarningsWithdrawn
        - event: LenderAddedPrincipal(indexed address,uint256,uint256,indexed address)
          handler: handleLenderAddedPrincipal
        - event: LoanRepaid(indexed uint256,indexed address,uint256,uint256,uint256,uint256)
          handler: handleLoanRepaid
        - event: DefaultedLoanLiquidated(indexed uint256,indexed address,uint256,int256)
          handler: handleLoanLiquidated
        - event: PoolInitialized(indexed address,indexed address,uint256,uint32,uint16,uint16,uint16,uint16,address)
          handler: handlePoolInitialized

